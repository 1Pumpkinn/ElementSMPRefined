name: ElementSMPRefined
version: '${version}'
main: net.rose.elementSMPRefined.ElementSMPRefined
author: PumpkinDev
contributors: [SantaEevee Magnet108]
api-version: '26.2'
load: STARTUP
softdepend: [ViaVersion]

commands:
  trust:
    description: Manage trust relationships
    usage: /trust <list|add|remove|accept|deny> [player]

  ability1:
    description: Use your element's first ability
    usage: /ability1
    aliases: [ a1 ]

  ability2:
    description: Use your element's second ability
    usage: /ability2
    aliases: [ a2 ]

  element:
    description: Element admin commands
    usage: /element <set|data|debug|config|particles> [player] [element]
    permission: element.admin

  util:
    description: Get utility items (upgraders and reroller)
    usage: /util
    permission: element.admin

  elements:
    description: View information about all elements
    usage: /elements [element_name]
    aliases: [ elementinfo, elinfo ]

  autosmelt:
    description: Toggle Fire/Lava auto smelt on or off (same as /toggle firesmelt)
    usage: /autosmelt [on|off]
    aliases: [ smelt ]

  toggle:
    description: Switch your element's passives on or off
    usage: /toggle [firesmelt|windburst] [on|off]
    aliases: [ toggles ]

  reforgealtar:
    description: Spawn, remove or inspect the Reforge Altar
    usage: /reforgealtar <spawn|here|remove|status|tp|toggle|enable|disable>
    aliases: [ altar ]
    permission: element.admin

  grace:
    description: Start, stop, extend or configure the server grace period
    usage: /grace <start [time] | stop | status | extend <time> | shorten <time> | settings | set <option> <value>>
    permission: element.admin

  dimension:
    description: Enable, disable (optionally for a set time) or configure Nether/End portal travel
    usage: /dimension <enable|disable|toggle> <nether|end|all> [time] | status | settings | set <option> <value>
    permission: element.admin

permissions:
  element.admin:
    description: Allows use of element admin commands
    default: op