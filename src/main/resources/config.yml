# Element SMP Configuration

# Mana Settings
mana:
  max: 100
  regen_per_second: 1
  # Flat cost baseline used by anything that isn't a real player with its own
  # per-element cost below (currently: the element bots, plus fallback for any
  # element/addon without a config section). Change these two values and every
  # bot picks it up automatically - no need to touch any Java class.
  ability1_cost: 30
  ability2_cost: 60

# Recipe Settings
recipes:
  advanced_reroller_enabled: true

# Status Effect Settings
status_effects:
  enabled: true
  damage_per_tick: true
  notification_messages: true

# Element Configuration (Data-driven settings)
elements:
