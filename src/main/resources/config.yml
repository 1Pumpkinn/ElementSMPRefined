# Element SMP Configuration

# Mana Settings
mana:
  max: 100
  regen_per_second: 1
  # Flat cost baseline used by anything that isn't a real player with its own
  # per-element cost below (currently: the element bots, plus fallback for any
  # element/addon without a config section). Change these two values and every
  # bot picks it up automatically - no need to touch any Java class.
  ability1_cost: 30
  ability2_cost: 60

# Recipe Settings
recipes:
  advanced_reroller_enabled: true

# Dimension Settings
dimensions:
  # When true, that dimension's portals (and anything entering one - vehicles,
  # ender pearls, dropped items) are cancelled. Toggle at runtime with
  # /dimension enable|disable <nether|end|all>.
  nether_disabled: true
  end_disabled: true

# Grace Period Settings
# The grace period is started/stopped with /grace start|stop, it does not
# start automatically unless auto_start is true. duration_seconds and
# hunger_protection_seconds below are just the defaults used when
# /grace start is run without explicit arguments.
grace_period:
  auto_start: false
  duration_seconds: 600
  hunger_protection_seconds: 300

# Status Effect Settings
status_effects:
  enabled: true
  damage_per_tick: true
  notification_messages: true

# Element Configuration (Data-driven settings)
elements:
  air:
    display_name: "Air"
    color: "LIGHT_PURPLE"
    enabled: true
    is_basic: true
    ability1_cost: 30
    ability2_cost: 60

