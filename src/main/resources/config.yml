# Element SMP Configuration
#
# Almost everything here can also be changed in-game without editing this file:
#   /grace set <option> <value>       /grace settings
#   /dimension set <option> <value>   /dimension settings
# Times accept plain seconds (90) or units: 30s, 10m, 1h30m, 2d.

# Team Settings
# Players make teams with /team. Everyone on a team can't damage each other, and abilities skip
# them. Allied teams (/team ally) are protected from each other the same way.
# Lowering a limit never removes anyone who is already in - it only stops new members/allies.
team:
  # Most players on one team, owner included
  max_members: 5
  # Most teams one team can be allied with (0 turns alliances off)
  max_allies: 1

# Resource Pack
# The plugin hosts the pack bundled in its jar (src/main/resources/elementsmprefined) itself and
# sends it to players when they join, so there is no link to upload or paste anywhere. To update
# the pack, change the files, rebuild and restart: the hash changes with the contents, so players
# re-download automatically. After editing this section run /element config reload and then
# /element pack reload.
resource_pack:
  enabled: true
  # What players connect to for the download: your server's public IP or domain, without
  # http:// or a port (use localhost when testing on your own PC)
  host: localhost
  # TCP port the plugin opens for the download. It has to be open / forwarded on your server.
  port: 8080
  # Interface to listen on (0.0.0.0 = all)
  bind_address: 0.0.0.0
  # Kick players who decline the pack or fail to download it
  required: true

# Dimension Settings
dimensions:
  # When true the dimension will not allow anyone to enter
  nether_disabled: true
  end_disabled: true
  # Tell players "Dimension is disabled." when they hit a blocked portal
  warn_players: true
  # Minimum seconds between those messages per player (0 = every time)
  warning_cooldown_seconds: 3
  # Shove players back out of a blocked portal so they don't re-trigger it
  pushback_enabled: true
  pushback_strength: 0.6
  # Also block boats, minecarts, ender pearls, items etc. from using blocked portals
  block_entities: true
  # Let players with element.admin use blocked portals anyway
  admin_bypass: false

# Grace Period Settings
# The grace period is started/stopped with /grace start|stop and never starts
# automatically. PvP is always disabled while it is active.
# duration_seconds is the default used when /grace start is run without a time.
grace_period:
  duration_seconds: 600
  # Countdown boss bar (applies the next time a grace period starts)
  boss_bar:
    # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    color: GREEN
  # Dimensions to automatically disable when the grace period starts
  on_start:
    disable_nether: false
    disable_end: false
  # Dimensions to automatically re-enable when the grace period runs out by
  # itself (not when it's stopped early with /grace stop)
  on_end:
    enable_nether: false
    enable_end: false

# Reforge Altar
# Every min..max hours an altar spawns somewhere in the world with a lodestone in
# the middle. Right-click the lodestone with the ingredients shown above it to get
# a Forged Upgrader - the recipe depends on your element (each player sees their own); the structure is then removed and the terrain it overwrote
# is restored. Only one altar exists at a time. Test it with /reforgealtar.
reforge_altar:
  # false = no new altars spawn automatically (also: /reforgealtar toggle|enable|disable).
  # An altar that already exists is left alone; /reforgealtar spawn still works for testing.
  enabled: true
  # World to spawn in (blank = first overworld)
  world: ""
  min_interval_hours: 6
  max_interval_hours: 12
  # Spawn distance from the world spawn, in blocks
  min_radius: 300
  max_radius: 3000
  # Max air gap allowed between the altar floor and the ground below it. Any gap up to
  # this is filled in with the local ground block (grass / sand / red sand / snow ...)
  # so the altar never floats; deeper holes are skipped.
  # (The altar also never spawns in trees or water.)
  max_floor_gap: 4
  # Random sites to try (water / uneven ground are skipped) before retrying in 5 minutes
  spawn_attempts: 25
  # Broadcast when an altar appears, optionally with its coordinates
  announce: true
  announce_coordinates: true

# Element info (/elements, /elementinfo)
# Elements listed here are hidden from /elements: they are left out of the list and tab completion
# and can't be looked up by name. Use this for elements that are not released yet. Players with
# element.admin still see them (marked "hidden"). Manage in-game with
# /element hide <element>, /element unhide <element> and /element hide list.
# Example: [lava, storm]
element_info:
  hidden_elements: []

# Life & Death event (/element event start life_death [duration])
# Kill hostile mobs for Death points and passive mobs for Life points. When it ends the top Death
# player gets the Book of Death and the top Life player gets the Book of Life.
events:
  life_death:
    # Used when /element event start life_death is run without a duration
    duration_seconds: 1800

# Potion limits
# Potion types nobody can brew, hold, drink, or have applied through
# dispensers / trial chambers. Manage in-game with /potlimits add|remove|list.
# Use the potion type key, e.g. strong_strength, long_swiftness, poison.
banned-potions: []

# Enchantment limits
# Level caps as "name=maxLevel"; 0 means the enchantment isn't allowed at all.
# Manage in-game with /enchantlimits set|ban|remove|list. Example: [sharpness=3, density=0, breach=0]
# The mace given by /enchantablemace is exempt from every limit.
enchant-limits: []
