# Element SMP Configuration

# Mana Settings
mana:
  max: 100
  regen_per_second: 1
  # Flat cost baseline used by anything that isn't a real player with its own
  # per-element cost below (currently: the element bots, plus fallback for any
  # element/addon without a config section). Change these two values and every
  # bot picks it up automatically - no need to touch any Java class.
  ability1_cost: 30
  ability2_cost: 60

# Recipe Settings
recipes:
  advanced_reroller_enabled: true

# Dimension Settings
dimensions:
  # When true, Nether/End portals (and anything entering one - vehicles,
  # ender pearls, dropped items) are cancelled. This is an element-based
  # overworld-only SMP, so vanilla dimension travel stays off.
  travel_disabled: true

# Grace Period Settings
grace_period:
  enabled: true
  # Total length of the grace period, in seconds. PvP is disabled for the
  # whole duration and a countdown boss bar is shown the whole time.
  duration_seconds: 600
  # How long, in seconds, players can't lose hunger for. This is a shorter
  # window inside the grace period above, and is capped to it automatically.
  hunger_protection_seconds: 300

# Status Effect Settings
status_effects:
  enabled: true
  damage_per_tick: true
  notification_messages: true

# Element Configuration (Data-driven settings)
elements:
  air:
    display_name: "Air"
    color: "LIGHT_PURPLE"
    enabled: true
    is_basic: true
    ability1_cost: 30
    ability2_cost: 60

